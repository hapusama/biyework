##### Parameters used for area a #####
# some parameters are reused for area b
# Training settings
train_flag: True
data_name: "FLOOR3_v3.pth"
save_model_name: "RGM_pretrain.ckpt"
frac_for_valid: 0.05
frac_for_test: 0.25

# Parameters for location classifier
num_locs: 19
input_dim: 16
hidden_dim: 128
dropout_pra: 0.1
learning_rate: 0.001
num_epochs: 100
batch_size: 256
location_vector_name: "location_vector_v2.csv"
config: "configs/pretrain.yml"

##### New parameters for pre-training CGM #####
signal_feature_dim: 6           # 因为inputdim太小，做一个线性变化为高纬度，组成channels*signal_feature_dim
loc_dim: 5             # for location vector
num_timesteps: 1000
schedule: "linear"    # cosine, linear, quadratic, sigmoid
data_channels: 2      # number of data channels（unet卷积层通道数）
channel_dimension_scale: [1, 2, 4,8]
num_epochs_rgm: 100
batch_size_rgm: 256
learning_rate_rgm: 0.001
rgm_pretrain_path: "1_pretrained_rgm.ckpt"
